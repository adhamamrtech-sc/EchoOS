name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Light dependencies only: audio and ASR tests skip themselves when
      # sounddevice / faster-whisper are not installed.
      - run: pip install numpy rapidfuzz psutil pytest
      - run: pytest -rs
